apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.raj.ransomrun"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            hostName: "ais-pre-nncvqcprezbrvtzh75nlbk-504272527330.us-east1.run.app",
            defaultUrl: "https://ais-pre-nncvqcprezbrvtzh75nlbk-504272527330.us-east1.run.app/",
            launcherName: "Raj's Run",
            assetStatements: '[{ "include": "https://ais-pre-nncvqcprezbrvtzh75nlbk-504272527330.us-east1.run.app/.well-known/assetlinks.json" }]',
            applicationId: "com.raj.ransomrun"
        ]
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
